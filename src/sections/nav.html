<style>
  /* --- Site nav ---------------------------------------------------------
     The bar is sticky, so anything an in-page link targets has to clear it. */
  section[id],
  main[id] {
    scroll-margin-top: 5rem;
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    border-radius: 9999px;
    padding: 0.375rem 0.75rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--color-cd-text-secondary);
    transition: color 150ms ease-out, background-color 150ms ease-out;
  }

  .nav-link:hover {
    color: var(--color-cd-text);
    background-color: var(--color-cd-bg-secondary);
  }

  /* The section the reader is in. A real underline rather than a box-shadow, so it
     survives forced-colors mode, and a colour shift alone is too quiet to find. */
  .nav-link[aria-current],
  .nav-link-mobile[aria-current] {
    color: var(--color-cd-text);
    text-decoration: underline;
    text-decoration-color: var(--color-cd-accent);
    text-decoration-thickness: 2px;
    text-underline-offset: 6px;
  }

  .nav-link-mobile {
    display: flex;
    align-items: center;
    min-height: 2.75rem;
    border-radius: 0.75rem;
    padding: 0.5rem 0.75rem;
    font-size: 1rem;
    font-weight: 500;
    color: var(--color-cd-text-secondary);
    transition: color 150ms ease-out, background-color 150ms ease-out;
  }

  .nav-link-mobile:hover,
  .nav-link-mobile[aria-current] {
    color: var(--color-cd-text);
    background-color: var(--color-cd-bg-secondary);
  }

  @media (prefers-reduced-motion: reduce) {
    .nav-link,
    .nav-link-mobile {
      transition: none;
    }
  }

  /* .cd-inline-link and the data-reveal rules are page wide, so they live in
     src/style.css rather than here, where three other sections would depend
     on this section being included first. */
</style>
