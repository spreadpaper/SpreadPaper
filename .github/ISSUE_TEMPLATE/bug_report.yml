name: Bug Report
description: Report a bug or issue with SpreadPaper
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use the title as a one-line summary of what is broken. Below, tell us what you saw and how to make it happen again. The fix can wait for the pull request.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, from launch, so someone else can see the same thing.
      placeholder: |
        1. Launch SpreadPaper
        2. Open a preset in the editor
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: What you see after the last step.
      placeholder: The border fades in and out on a loop for as long as the field has focus.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen
      placeholder: The border turns solid and stays solid until focus leaves.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SpreadPaper version
      description: Settings, Updates, or the About panel.
      placeholder: e.g. 1.8.0
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.1
    validations:
      required: true

  - type: dropdown
    id: mac-type
    attributes:
      label: Mac type
      options:
        - Apple Silicon (M1/M2/M3/M4)
        - Intel
    validations:
      required: true

  - type: input
    id: monitors
    attributes:
      label: Monitors
      description: How many, and how they are arranged if it matters.
      placeholder: e.g. 2 side by side, or 3 vertical
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, or anything else
      description: Drag images here. Anything else that might matter, like when it started, other displays, or what you tried. If the wallpaper failed to apply, run `log show --predicate 'subsystem == "com.cattlea.SpreadPaper"' --info --last 10m` in Terminal and paste the output.
    validations:
      required: false
